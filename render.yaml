services:
  - type: web
    name: enviorwealth-backend
    env: python
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_SECRET_KEY
        generateValue: true
