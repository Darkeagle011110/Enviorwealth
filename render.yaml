services:
  - type: web
    name: enviorwealth-backend
    env: python
    rootDir: backend
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enviorwealth-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: enviorwealth-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_SECRET_KEY
        generateValue: true

  - type: redis
    name: enviorwealth-redis
    ipAllowList: [] # internal only

databases:
  - name: enviorwealth-db
    databaseName: enviorwealth
    user: enviorwealth_user
