version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector + PostGIS extensions
  # Serves: relational data, vector embeddings (RAG), geospatial data
  # ──────────────────────────────────────────────────────────────────
  db:
    build:
      context: ./backend
      dockerfile: Dockerfile.db
    container_name: carbon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbonpass}
      POSTGRES_DB: ${POSTGRES_DB:-carbondb}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/models/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbon} -d ${POSTGRES_DB:-carbondb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────
  # Redis 7 — ephemeral session/conversation state, rate limiting
  # ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: carbon_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
