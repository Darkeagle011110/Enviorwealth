version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────────
  # MongoDB 7 — primary data store for all application data:
  # users, assessment sessions, gate results, assessments, leads,
  # audit logs, LLM configs, knowledge documents, and chat sessions.
  # ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: envirowealth_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-envirowealth}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-envirowealth_pass}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-envirowealth}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────
  # NOTE: Qdrant is hosted on Qdrant Cloud — no local container needed.
  # Configure QDRANT_URL and QDRANT_API_KEY in your .env file.
  # ──────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────
  # Backend Service
  # ──────────────────────────────────────────────────────────────────
  backend:
    build: 
      context: ./backend
    container_name: envirowealth_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://${MONGO_USER:-envirowealth}:${MONGO_PASSWORD:-envirowealth_pass}@mongodb:27017/${MONGODB_DB_NAME:-envirowealth}?authSource=admin
    volumes:
      - uploaded_docs:/app/uploaded_docs
    depends_on:
      - mongodb

volumes:
  mongodata:
  uploaded_docs:
